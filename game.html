<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #0a0a0a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #gameCanvas {
      border: 2px solid #333;
      box-shadow: 0 0 40px rgba(33, 33, 62, 0.3);
      image-rendering: pixelated;
    }

    #resolutionMenu {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #1a1a1a;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 30px;
      display: none;
      z-index: 1000;
    }

    #resolutionMenu h2 {
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }

    .resolution-btn {
      width: 100%;
      padding: 15px;
      margin-bottom: 10px;
      background-color: #0a0a0a;
      border: 2px solid #333;
      border-radius: 4px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .resolution-btn:hover {
      background-color: #222;
      border-color: #444;
    }

    .resolution-btn.active {
      background-color: #333;
    }

    #info {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: rgba(26, 26, 26, 0.9);
      border: 1px solid #333;
      border-radius: 4px;
      padding: 10px 15px;
      font-size: 14px;
      color: #888;
    }

    #messageBox {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 250px;
      background-color: rgba(26, 26, 26, 0.95);
      border: 2px solid #333;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
      display: none;
      flex-direction: column;
    }

    #messageBox.show {
      display: flex;
    }

    #messageList {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #444;
    }

    .chat-message {
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .chat-message .sender {
      font-weight: bold;
      color: #4aff4a;
      margin-right: 5px;
    }

    .chat-message .system {
      font-weight: bold;
      color: #ffff4a;
      margin-right: 5px;
    }

    .chat-message .text {
      color: #fff;
    }

    #messageInputContainer {
      padding: 0 10px 10px 10px;
    }

    #messageInput {
      flex: 1;
      background-color: rgba(0, 0, 0, 0.5);
      border: 1px solid #555;
      border-radius: 3px;
      padding: 8px;
      color: #fff;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    #messageInput:focus {
      outline: none;
      border-color: #4aff4a;
    }



    #party-ui {
      position: fixed;
      left: 20px;
      top: 20px;
      width: 300px;
      max-height: 600px;
      background-color: rgba(26, 26, 26, 0.95);
      border: 2px solid #333;
      border-radius: 4px;
      padding: 15px;
      display: none;
      overflow-y: auto;
    }

    #party-ui h3 {
      margin-bottom: 15px;
      color: #fff;
      font-size: 18px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .party-player-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin-bottom: 8px;
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid #444;
      border-radius: 3px;
    }

    .party-player-info {
      flex: 1;
    }

    .party-player-name {
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }

    .party-player-details {
      font-size: 12px;
      color: #888;
    }

    .party-invite-btn {
      padding: 6px 12px;
      background-color: #2a5;
      border: none;
      border-radius: 3px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    .party-invite-btn:hover {
      background-color: #3b6;
    }

    .party-invite-btn:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
  </style>

</head>

<body>
  <canvas id="gameCanvas"></canvas>
  <div id="messageBox">
    <div id="messageList"></div>
    <div id="messageInputContainer">
      <input type="text" id="messageInput" placeholder="Type a message and press Enter..." maxlength="200">
    </div>
  </div>
  <div id="resolutionMenu">
    <h2>Select Resolution</h2>
    <button class="resolution-btn" data-res="16">16x16 px</button>
    <button class="resolution-btn" data-res="32">32x32 px</button>
    <button class="resolution-btn" data-res="48">48x48 px</button>
    <button class="resolution-btn" data-res="64">64x64 px</button>
    <button class="resolution-btn" data-res="96">96x96 px</button>
    <button class="resolution-btn" data-res="128">128x128 px</button>
  </div>
  <div id="info">Press R to change resolution | Press P for party</div>
  <div id="party-ui">
    <h3>Players</h3>
    <div id="party-player-list"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="seedGen.js"></script>
  <script src="movement.js"></script>
  <script src="town.js"></script>
  <script src="simulate.js"></script>
  <script src="items.js"></script>
  <script src="inventory.js"></script>
  <script src="storage.js"></script>
  <script src="levelSystem.js"></script>
  <script src="characterSheet.js"></script>
  <script src="monsters.js"></script>
  <script src="party.js"></script>
  <script src="fight.js"></script>
  <script src="skills.js"></script>
  <script src="game.js"></script>

  <script>
    const protocol = window.location.protocol === 'https:' ? 'https' : 'http';
    const host = window.location.host;
    const socket = io(`${protocol}://${host}`);

    const savedCharacter = localStorage.getItem('character');
    const savedGame = localStorage.getItem('currentGame');

    if (!savedCharacter || !savedGame) {
      window.location.href = 'lobby.html';
    } else {
      const character = JSON.parse(savedCharacter);
      const gameInfo = JSON.parse(savedGame);

      const game = new Game(gameInfo.mapSeed);
      game.character = character;
      game.gameName = gameInfo.gameName;
      game.gameId = gameInfo.id;
      game.socket = socket;
      game.otherPlayers = gameInfo.players || [];

      const inventory = new Inventory(game, socket);
      game.inventory = inventory;

      const storage = new Storage(game, socket);
      game.storage = storage;

      const movement = new Movement(game);
      const simulator = new Simulator(game, movement);

      const fight = new Fight(game);
      game.fight = fight;

      const skillSystem = new SkillSystem(game);
      game.skills = skillSystem;

      const characterSheet = new CharacterSheet(game, socket);
      game.characterSheet = characterSheet;

      // Initialize Party Manager
      const partyManager = new PartyManager(game);
      game.partyManager = partyManager;

      // Add P key handler for party UI
      document.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P') {
          if (!game.menuOpen) {  // Don't toggle if resolution menu is open
            partyManager.toggleUI();
          }
        }
      });

      // Party socket handlers
      socket.on('player_list_updated', (players) => {
        partyManager.displayPlayerList(players);
      });

      socket.on('party_invite_received', (data) => {
        partyManager.receivePartyInvite(data.from);
      });

      socket.on('party_updated', (partyData) => {
        partyManager.updateParty(partyData);
      });

      socket.on('party_left', () => {
        partyManager.currentParty = null;
        game.setMessage('You left the party');
      });

      // Handle forced lobby redirect (from auto-cleanup)
      socket.on('force_lobby', (data) => {
        console.log('Forced to lobby:', data.message || 'Returning to lobby...');
        window.location.href = 'lobby.html';
      });

      // Socket handlers
      socket.on('position_updated', (data) => {
        if (data.playerName === character.name) return;

        let otherPlayer = game.otherPlayers.find(p => p.name === data.playerName);
        if (!otherPlayer) {
          otherPlayer = {
            name: data.playerName,
            x: data.x,
            y: data.y,
            equipment: data.equipment || {}
          };
          game.otherPlayers.push(otherPlayer);
        } else {
          otherPlayer.x = data.x;
          otherPlayer.y = data.y;
          otherPlayer.equipment = data.equipment || {};
        }
        game.render();
      });

      socket.on('location_updated', (data) => {
        const otherPlayer = game.otherPlayers.find(p => p.name === data.playerName);
        if (otherPlayer) {
          otherPlayer.location = data.location;
        }
      });

      socket.on('player_left', (data) => {
        game.otherPlayers = game.otherPlayers.filter(p => p.name !== data.name);
        game.setMessage(data.name + ' left the game');
        game.render();
      });

      socket.on('players_in_game', (players) => {
        game.otherPlayers = players.filter(p => p.name !== character.name);
        game.render();
      });

      socket.on('equipment_changed', (data) => {
        const player = game.otherPlayers.find(p => p.name === data.playerName);
        if (player) {
          player.equipment = data.equipment;
          game.render();
        }
      });

      socket.on('new_player_joined', (player) => {
        if (player.name !== character.name && !game.otherPlayers.find(p => p.name === player.name)) {
          game.otherPlayers.push(player);
          game.render();
        }
      });

      // Handle chat messages
      socket.on('chat_message', (data) => {
        game.setMessage(data.text, data.playerName);
      });

      // Handle map events from other players (enemy kills, trap activations, etc.)
      socket.on('map_event_broadcast', (data) => {
        const { type, x, y, location, playerName } = data;

        // Only process if we're in the same location
        const currentLocation = game.inTown && game.currentTown
          ? game.currentTown.name
          : (game.currentLocation || 'wilderness');

        if (location !== currentLocation) return;

        if (type === 'enemy_killed') {
          // Remove enemy from our local map
          const enemyIndex = game.enemies.findIndex(e => e.x === x && e.y === y);
          if (enemyIndex !== -1) {
            game.enemies.splice(enemyIndex, 1);
            game.render();
          }
        }
      });

      socket.on('connect', () => {
        socket.emit('join_game', {
          gameId: gameInfo.id,
          password: gameInfo.password || '',
          player: {
            name: character.name,
            class: character.class,
            race: character.race,
            level: character.level,
            x: 6,
            y: 1
          }
        });

        socket.emit('update_location', {
          gameId: gameInfo.id,
          playerName: character.name,
          location: 'Skargnes'
        });
      });


      // Handle page refresh/close - immediate cleanup
      window.addEventListener('beforeunload', () => {
        // Clear game data from localStorage so player goes to lobby on refresh
        localStorage.removeItem('currentGame');

        socket.emit('leave_game', {
          gameId: gameInfo.id,
          playerName: character.name
        });
      });

      // Initialize town
      const skargnes = createSkargnes(game, gameInfo.mapSeed);
      skargnes.enter();

      // Broadcast position AND equipment every 500ms
      setInterval(() => {
        if (socket.connected) {
          socket.emit('update_position', {
            gameId: gameInfo.id,
            playerName: character.name,
            x: game.player.x,
            y: game.player.y,
            equipment: {
              weapon: game.inventory.equipped.weapon,
              armor: game.inventory.equipped.armor,
              helm: game.inventory.equipped.helm,
              shield: game.inventory.equipped.shield
            }
          });
        }
      }, 500);

      game.setMessage('Welcome! Press E near NPCs to interact, WASD to move');
    }
  </script>
</body>

</html>
