<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Character</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background-color: #0a0a0a; color: #fff; padding: 40px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    h1 { color: #4aff4a; font-size: 32px; }
    .logout { padding: 10px 20px; background-color: #333; border: none; border-radius: 4px; color: #fff; cursor: pointer; }
    .logout:hover { background-color: #444; }
    .characters { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .char-card { background-color: #1a1a1a; border: 2px solid #333; border-radius: 8px; padding: 20px; cursor: pointer; transition: all 0.3s; }
    .char-card:hover { border-color: #4a7c3e; background-color: #222; }
    .char-card h3 { color: #4aff4a; margin-bottom: 10px; font-size: 20px; }
    .char-card p { color: #888; font-size: 14px; margin: 5px 0; }
    .create-new { background-color: #1a1a1a; border: 2px dashed #4a7c3e; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .create-new:hover { background-color: #222; border-style: solid; }
    .create-new-text { color: #4aff4a; font-size: 18px; font-weight: bold; }
    .empty { text-align: center; color: #666; padding: 60px 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Select Character</h1>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>

    <div id="charactersList" class="characters"></div>

    <div class="create-new" id="createNewBtn">
      <div class="create-new-text">+ Create New Character</div>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) {
      window.location.href = 'login.html';
    }

    let characters = [];

    async function loadCharacters() {
      try {
        const response = await fetch(`http://localhost:3000/characters/${user.id}`);
        const data = await response.json();
        characters = data.characters || [];
        renderCharacters();
      } catch (err) {
        console.error('Failed to load characters:', err);
      }
    }

    function renderCharacters() {
      const list = document.getElementById('charactersList');
      
      if (characters.length === 0) {
        list.innerHTML = '<div class="empty">No characters yet. Create your first one!</div>';
        return;
      }

      list.innerHTML = characters.map(char => `
        <div class="char-card" onclick="selectCharacter(${char.id})">
          <h3>${char.name}</h3>
          <p>Level ${char.level} ${char.race} ${char.class}</p>
          <p style="color: #666; margin-top: 10px;">Alignment: ${char.alignment}</p>
        </div>
      `).join('');
    }

    function selectCharacter(charId) {
      const character = characters.find(c => c.id === charId);
      if (character) {
        localStorage.setItem('character', JSON.stringify(character));
        window.location.href = 'lobby.html';
      }
    }

    document.getElementById('createNewBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('user');
      localStorage.removeItem('character');
      window.location.href = 'login.html';
    });

    loadCharacters();
  </script>
</body>
</html>
