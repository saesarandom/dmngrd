<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Lobby</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background-color: #0a0a0a; color: #fff; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #4aff4a; margin-bottom: 20px; }
    .status { padding: 10px; background-color: #1a1a1a; border-left: 3px solid #ff4a4a; margin-bottom: 20px; }
    .status.connected { border-left-color: #4aff4a; }
    .games { display: grid; gap: 15px; margin-bottom: 30px; }
    .game-card { background-color: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 15px; }
    .game-card h3 { color: #4aff4a; margin-bottom: 10px; }
    .game-card p { color: #888; font-size: 14px; margin: 5px 0; }
    button { padding: 10px 20px; background-color: #4a7c3e; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #5a8c4e; }
    button:disabled { background-color: #333; cursor: not-allowed; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background-color: #1a1a1a; border: 2px solid #4a7c3e; border-radius: 8px; padding: 30px; width: 400px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; color: #888; font-size: 12px; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px; background-color: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #fff; }
    .form-buttons { display: flex; gap: 10px; }
    .form-buttons button { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Game Lobby</h1>
    <div id="status" class="status">● Connecting...</div>

    <button id="createBtn">+ Create Game</button>

    <h2 style="margin-top: 30px; margin-bottom: 15px;">Available Games</h2>
    <div id="gamesList" class="games"></div>
  </div>

  <!-- Create Game Modal -->
  <div id="createModal" class="modal">
    <div class="modal-content">
      <h2 style="color: #4aff4a; margin-bottom: 20px;">Create Game</h2>
      <div class="form-group">
        <label>Game Name</label>
        <input type="text" id="gameName" placeholder="e.g. Adventure #1" maxlength="30">
      </div>
      <div class="form-group">
        <label>Password (Optional)</label>
        <input type="password" id="gamePassword" placeholder="Leave blank for public">
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="pvpCheck" checked>
          Enable PVP
        </label>
      </div>
      <div class="form-buttons">
        <button onclick="closeModal()">Cancel</button>
        <button onclick="submitCreate()">Create</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
  <script>
    const character = JSON.parse(localStorage.getItem('character'));
    if (!character) {
      window.location.href = '/';
      throw new Error('No character');
    }

    // Connect to server
    const socket = io('http://localhost:3000', {
      reconnection: true,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
      reconnectionAttempts: 5
    });

    let games = [];

    socket.on('connect', () => {
      console.log('✓ Connected to server');
      updateStatus('Connected', true);
      loadGames();
    });

    socket.on('disconnect', () => {
      console.log('✗ Disconnected');
      updateStatus('Disconnected', false);
    });

    socket.on('games_updated', (updatedGames) => {
      console.log('Games updated:', updatedGames.length);
      games = updatedGames;
      renderGames();
    });

    socket.on('game_created', (game) => {
      console.log('Game created:', game.name);
      const gameInfo = {
        id: game.id,
        gameName: game.name,
        mapSeed: game.map_seed,
        isCreator: true,
        password: game.password,
        players: game.players
      };
      localStorage.setItem('currentGame', JSON.stringify(gameInfo));
      alert('Game created! Redirecting...');
      window.location.href = '/game.html';
    });

    socket.on('game_joined', (game) => {
      console.log('Game joined:', game.name);
      const gameInfo = {
        id: game.id,
        gameName: game.name,
        mapSeed: game.map_seed,
        isCreator: false,
        players: game.players
      };
      localStorage.setItem('currentGame', JSON.stringify(gameInfo));
      alert('Joined game! Redirecting...');
      window.location.href = '/game.html';
    });

    socket.on('error', (err) => {
      alert('Error: ' + err.message);
    });

    function updateStatus(msg, connected) {
      const status = document.getElementById('status');
      status.textContent = (connected ? '●' : '●') + ' ' + msg;
      status.classList.toggle('connected', connected);
    }

    function loadGames() {
      fetch('http://localhost:3000/games')
        .then(res => res.json())
        .then(data => {
          games = data || [];
          console.log('Games loaded:', games.length);
          renderGames();
        })
        .catch(err => {
          console.error('Failed to load games:', err);
          games = [];
          renderGames();
        });
    }

    function renderGames() {
      const list = document.getElementById('gamesList');
      if (!games || games.length === 0) {
        list.innerHTML = '<p style="color: #666;">No games available. Create one!</p>';
        return;
      }

      list.innerHTML = games.map(game => `
        <div class="game-card">
          <h3>${game.name}</h3>
          <p>Creator: ${game.creator_name}</p>
          <p>Seed: ${game.map_seed}</p>
          ${game.password ? '<p>🔒 Password Protected</p>' : ''}
          ${!game.pvp_enabled ? '<p>⚔️ PVE Mode</p>' : '<p>⚔️ PVP Enabled</p>'}
          <button onclick="joinGame('${game.id}', ${game.password ? 'true' : 'false'})">Join Game</button>
        </div>
      `).join('');
    }

    function openModal() {
      document.getElementById('createModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('createModal').classList.remove('active');
    }

    function submitCreate() {
      const name = document.getElementById('gameName').value.trim();
      const password = document.getElementById('gamePassword').value.trim();
      const pvp = document.getElementById('pvpCheck').checked;

      if (!name) {
        alert('Enter game name');
        return;
      }

      const mapSeed = Date.now().toString();

      socket.emit('create_game', {
        gameName: name,
        password: password || null,
        pvpEnabled: pvp,
        mapSeed: mapSeed,
        player: {
          name: character.name,
          class: character.class,
          race: character.race,
          level: character.level,
          x: 6,
          y: 1
        }
      });

      closeModal();
      document.getElementById('gameName').value = '';
      document.getElementById('gamePassword').value = '';
    }

    function joinGame(gameId, hasPassword) {
      const numGameId = parseInt(gameId);
      const game = games.find(g => parseInt(g.id) === numGameId);
      
      if (!game) {
        console.error('Game not found:', gameId);
        return;
      }

      let password = null;
      if (hasPassword) {
        password = prompt('Enter game password:');
        if (password === null) return;
      }

      socket.emit('join_game', {
        gameId: numGameId,
        password: password,
        player: {
          name: character.name,
          class: character.class,
          race: character.race,
          level: character.level,
          x: 6,
          y: 1
        }
      });
    }

    document.getElementById('createBtn').addEventListener('click', openModal);
  </script>
</body>
</html>
