<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background-color: #0a0a0a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    #gameCanvas { border: 2px solid #333; box-shadow: 0 0 40px rgba(33, 33, 62, 0.3); image-rendering: pixelated; }
    #resolutionMenu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #1a1a1a; border: 2px solid #333; border-radius: 8px; padding: 30px; display: none; z-index: 1000; }
    #resolutionMenu h2 { color: #333; text-align: center; margin-bottom: 20px; }
    .resolution-btn { width: 100%; padding: 15px; margin-bottom: 10px; background-color: #0a0a0a; border: 2px solid #333; border-radius: 4px; color: #fff; font-size: 16px; cursor: pointer; }
    .resolution-btn:hover { background-color: #222; border-color: #444; }
    .resolution-btn.active { background-color: #333; }
    #info { position: fixed; top: 20px; right: 20px; background-color: rgba(26, 26, 26, 0.9); border: 1px solid #333; border-radius: 4px; padding: 10px 15px; font-size: 14px; color: #888; }
    #messageBox { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 600px; min-height: 120px; background-color: rgba(26, 26, 26, 0.95); border: 2px solid #333; border-radius: 4px; padding: 20px; color: #fff; font-size: 16px; display: none; }
    #messageBox.show { display: block; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="messageBox"></div>
  <div id="resolutionMenu">
    <h2>Select Resolution</h2>
    <button class="resolution-btn" data-res="16">16x16 px</button>
    <button class="resolution-btn" data-res="32">32x32 px</button>
    <button class="resolution-btn" data-res="48">48x48 px</button>
    <button class="resolution-btn" data-res="64">64x64 px</button>
    <button class="resolution-btn" data-res="96">96x96 px</button>
    <button class="resolution-btn" data-res="128">128x128 px</button>
  </div>
  <div id="info">Press R to change resolution</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="seedGen.js"></script>
  <script src="movement.js"></script>
  <script src="town.js"></script>
  <script src="simulate.js"></script>
  <script src="items.js"></script>
  <script src="inventory.js"></script>
  <script src="monsters.js"></script>
  <script src="fight.js"></script>
  <script src="skills.js"></script>
  <script src="game.js"></script>

  <script>
    const protocol = window.location.protocol === 'https:' ? 'https' : 'http';
    const host = window.location.host;
    const socket = io(`${protocol}://${host}`);

    const savedCharacter = localStorage.getItem('character');
    const savedGame = localStorage.getItem('currentGame');

    if (!savedCharacter || !savedGame) {
      window.location.href = 'index.html';
    } else {
      const character = JSON.parse(savedCharacter);
      const gameInfo = JSON.parse(savedGame);
      
      console.log('=== PLAYER INIT ===');
      console.log('Character:', character.name);
      console.log('Game:', gameInfo.gameName);
      console.log('Seed:', gameInfo.mapSeed);
      console.log('Full gameInfo:', gameInfo);
      
      const game = new Game(gameInfo.mapSeed);
      game.character = character;
      game.gameName = gameInfo.gameName;
      game.socket = socket;
      game.otherPlayers = gameInfo.players || [];

      const inventory = new Inventory(game);
      game.inventory = inventory;

      const movement = new Movement(game);
      const simulator = new Simulator(game, movement);
      
      const fight = new Fight(game);
      game.fight = fight;
      
      const skillSystem = new SkillSystem(game);
      game.skills = skillSystem;
      
      // Broadcast initial location
      socket.emit('update_location', {
        gameName: gameInfo.gameName,
        location: 'Skargnes'
      });
      
      console.log('Setting up socket listeners...');

      socket.on('position_updated', (data) => {
        let otherPlayer = game.otherPlayers.find(p => p.name === data.playerName);
        
        if (!otherPlayer) {
          // Create new entry if doesn't exist
          otherPlayer = { name: data.playerName, x: data.x, y: data.y };
          game.otherPlayers.push(otherPlayer);
          console.log('Added new player to otherPlayers');
        } else {
          // Update existing
          otherPlayer.x = data.x;
          otherPlayer.y = data.y;
        }
        
        game.render();
      });

      socket.on('location_updated', (data) => {
        const otherPlayer = game.otherPlayers.find(p => p.name === data.playerName);
        if (otherPlayer) {
          otherPlayer.location = data.location;
        }
        console.log(data.playerName + ' moved to ' + data.location);
      });

      socket.on('player_left', (data) => {
        game.otherPlayers = game.otherPlayers.filter(p => p.name !== data.name);
        game.setMessage(data.name + ' left the game');
        game.render();
      });

      socket.on('players_in_game', (players) => {
        game.otherPlayers = players.filter(p => p.name !== character.name);
        console.log('Other players:', game.otherPlayers.length);
        game.render();
      });

      socket.on('new_player_joined', (player) => {
        console.log('New player joined:', player.name);
        if (!game.otherPlayers.find(p => p.name === player.name)) {
          game.otherPlayers.push(player);
          game.render();
        }
      });

      // Both creator and joiner need to join room
      socket.on('connect', () => {
        socket.emit('join_game', {
          gameId: gameInfo.id,
          password: gameInfo.password || '',
          player: {
            name: character.name,
            class: character.class,
            race: character.race,
            level: character.level,
            x: 6,
            y: 1
          }
        });
      });
      
      // Initialize town
      const skargnes = createSkargnes(game, gameInfo.mapSeed);
      skargnes.enter();
      
      // Broadcast position every 500ms
      setInterval(() => {
        if (socket.connected) {
          socket.emit('update_position', {
            gameId: gameInfo.id,
            playerName: character.name,
            x: game.player.x,
            y: game.player.y
          });
        }
      }, 500);
      
      game.setMessage('Welcome! Press E near NPCs to interact, WASD to move');
    }
  </script>
</body>
</html>
